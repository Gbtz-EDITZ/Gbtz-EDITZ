
name: Haxelyn Profile Statistics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Statistics
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Gbtz-EDITZ
          BRANCH_NAME: main
          UTC_OFFSET: 8
          AUTO_PUSH: true
          THEME: nord_dark
          ANIMATION: draw
          DURATION: "3"
          NAME: Haxelyn
          
